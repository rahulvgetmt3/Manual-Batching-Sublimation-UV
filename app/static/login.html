<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UV Mix Batch – Sign in</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --ink:#111827; --muted:#6b7280; --line:#e5e7eb; --accent:#1b4dea; --bad:#b91c1c; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; color:var(--ink);
         background:linear-gradient(135deg,#5266e4 0%,#5a47ae 55%,#5f3894 100%);
         font:15px/1.45 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding:16px; }
  .logo { display:block; height:44px; margin:0 0 14px; }
  form { background:var(--card); border:0; border-radius:12px; box-shadow:0 20px 50px rgba(30,20,90,.35); padding:28px; width:100%; max-width:340px; }
  h1 { font-size:18px; margin:0 0 4px; }
  p { margin:0 0 20px; color:var(--muted); font-size:13px; }
  label { display:block; font-size:12px; font-weight:600; margin:12px 0 4px; color:var(--muted); }
  input { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:15px; }
  button { margin-top:20px; width:100%; padding:11px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-size:15px; font-weight:600; cursor:pointer; }
  .err { color:var(--bad); font-size:13px; margin-top:12px; display:none; }
</style>
</head>
<body>
<form method="post" action="/login">
  <img class="logo" src="/static/mt3-mark.png" alt="MT3">
  <h1>UV Mix Batch</h1>
  <p>LUX &amp; Mirror bed builder</p>
  <label for="u">Username</label>
  <input id="u" name="username" autocomplete="username" autofocus required>
  <label for="p">Password</label>
  <input id="p" name="password" type="password" autocomplete="current-password" required>
  <button type="submit">Sign in</button>
  <div class="err" id="err">Wrong username or password.</div>
</form>
<script>if (location.search.includes('error')) document.getElementById('err').style.display='block';</script>
</body>
</html>
